<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iZindigoFiles | No-Root ANGLE & 120 FPS Boost Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --badge-bg: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #090d16;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 2rem;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .global-stats {
            display: inline-block;
            background-color: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--accent);
            border: 1px solid #334155;
            margin-top: 10px;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 8px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0,
: <span id="dlPerf">0</span></span>
            </div>
        </div>
    </div>

    <script>
        // Global View Counter gamit ang CountAPI
        fetch('https://api.countapi.xyz/hit/izindigofiles/visits')
            .then(res => res.json())
            .then(res => { document.getElementById('viewCount').innerText = res.value; })
            .catch(() => { document.getElementById('viewCount').innerText = "600+"; });

        // Copy Function
        function copyCode(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = '✅ Copied!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            });
        }

        // Download Function + Counter Update
        function downloadCode(elementId, filename, counterId) {
            const text = document.getElementById(elementId).innerText;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            // Update counter sa API at screen
            fetch(`https://api.countapi.xyz/hit/izindigofiles/${counterId}`)
                .then(res => res.json())
                .then(res => { document.getElementById(counterId).innerText = res.value; })
                .catch(() => {
                    let el = document.getElementById(counterId);
                    el.innerText = (parseInt(el.innerText) || 0) + 1;
                });
        }

        // I-load ang kasalukuyang download counts pagbukas ng site
        ['dlFps', 'dlPixelated', 'dlPerf'].forEach(id => {
            fetch(`https://api.countapi.xyz/get/izindigofiles/${id}`)
                .then(res => res.json())
                .then(res => { if(res.value) document.getElementById(id).innerText = res.value; })
                .catch(() => {});
        });
    </script>
</body>
</html>
